name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core:
    # The core package is pure Dart with no runtime dependencies, so it analyzes and
    # tests in seconds without a Flutter toolchain, an emulator, or a network. Every
    # provider adapter, the schema dialects and the chunk planner are covered here.
    name: transcript_core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/transcript_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  schema-sync:
    name: docs are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/transcript_core
      # Regenerates docs/schemas/note-document.schema.json from the Dart source of truth
      # and fails if it differs — the docs cannot drift from what ships.
      - run: dart run tool/export_schema.dart
        working-directory: packages/transcript_core
      - run: git diff --exit-code docs/schemas/note-document.schema.json
      # Same rule for the privacy doc the store answers are copied out of: it is
      # generated from the disclosure the app itself displays, so a listing can only be
      # wrong if the app is wrong too.
      - run: dart run tool/export_privacy.dart
        working-directory: packages/transcript_core
      - run: git diff --exit-code docs/PRIVACY.md

  whisper-native:
    # Builds the vendored ggml/whisper.cpp CPU backend for Linux x64 straight from
    # src/CMakeLists.txt (the same recipe the Android/Windows builds use) and runs the
    # FFI bindings against the real compiled library, so the native decode path is
    # genuinely exercised in CI rather than only analyzed.
    name: transcript_whisper_native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/transcript_whisper_native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: tool/build_native_test_lib.sh
      - run: flutter test test/native_smoke_test.dart

  app:
    name: echo_codex_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # drift generates database.g.dart; analyze fails without it.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  ios:
    name: iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Simulator, not device: --no-codesign skips signing but still targets a
      # device, which needs a Development Team no hosted runner has.
      - run: flutter build ios --debug --simulator

  # The three desktop targets were never built here, which is how the macOS release
  # build shipped with only the sandbox entitlement — no microphone, no outgoing
  # network, no file access — for as long as it did. A build is the cheapest check
  # that a platform's configuration is still coherent.
  macos:
    name: macOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --debug
      # The entitlements are the part a build alone would not catch: a missing one
      # fails at runtime on a user's machine, not at compile time.
      - name: the release build can record, reach the network and open files
        run: |
          set -euo pipefail
          ents=macos/Runner/Release.entitlements
          for key in \
            com.apple.security.device.audio-input \
            com.apple.security.network.client \
            com.apple.security.files.user-selected.read-write
          do
            /usr/libexec/PlistBuddy -c "Print :$key" "$ents" >/dev/null \
              || { echo "::error file=app/$ents::$key is missing — the sandboxed app cannot do its job without it"; exit 1; }
          done

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev \
            libsecret-1-dev libjsoncpp-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --debug

  windows:
    name: Windows build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --debug
